name: Build Whyred Kernel with SukiSU v4.1 (Manual Hook)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup SukiSU v4.1 (Manual Hook)
        run: |
          # 1. Clone driver SukiSU dari branch 'builtin' (untuk manual hook)
          git clone --depth=1 --branch builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          
          # 2. Pindahkan driver ke folder kernel
          mkdir -p drivers/kernelsu
          cp -r KernelSU/kernel/* drivers/kernelsu/
          rm -rf KernelSU
          
          # 3. Patch manual hook ke file inti kernel
          # Patch untuk fs/exec.c
          sed -i '/#include <linux\/sched.h>/a #ifdef CONFIG_KSU\n#include <linux\/ksu.h>\n#endif' fs/exec.c
          sed -i '/int do_execveat_common/i #ifdef CONFIG_KSU\n    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif' fs/exec.c
          
          # Patch untuk fs/open.c
          sed -i '/#include <linux\/sched.h>/a #ifdef CONFIG_KSU\n#include <linux\/ksu.h>\n#endif' fs/open.c
          sed -i '/SYSCALL_DEFINE3(faccessat/i #ifdef CONFIG_KSU\n    ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif' fs/open.c
          
          # 4. Fix error static_call (Kernel 4.4 gak punya ini)
          find drivers/kernelsu/ -type f \( -name "*.h" -o -name "*.c" \) | xargs sed -i '/#include <linux\/static_call.h>/d'
          find drivers/kernelsu/ -type f \( -name "*.h" -o -name "*.c" \) | xargs sed -i '/#include <linux\/static_call_types.h>/d'
          sed -i '1i #define static_call(name) name\n#define static_call_update(name, func) do { } while (0)\n#define static_call_cond(name) name' $(find drivers/kernelsu -type f -name "*.c" | head -n 1)
          
          # 5. Aktifkan KSU di defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/whyred_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/whyred_defconfig

          echo "Patching SukiSU v4.1 (Manual Hook) Selesai!"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm make git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Compile Kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out ARCH=arm64 whyred_defconfig
          make -j4 O=out ARCH=arm64 2>&1 | tee build.log

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Whyred-SukiSU-v4.1
          path: out/arch/arm64/boot/Image.gz-dtb
