name: Build Whyred Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Kernel with SukiSU
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Kenzilah/android_kernel_xiaomi_sdm660_44
          kernel-branch: android-4.4-stable
          config: whyred_defconfig
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-gcc: true
          ksu: true
          anykernel3: true
          release: false # <--- KITA MATIIN FITUR RELEASE-NYA
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Simpan File Zip ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-RienaC1-meot
          path: "**/*.zip" # Nyari file zip di mana pun letaknya
