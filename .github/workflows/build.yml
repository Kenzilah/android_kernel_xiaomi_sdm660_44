name: Build Kernel
on: workflow_dispatch
env:
  DEFCONFIG: whyred_defconfig
  KBUILD_BUILD_USER: pei 
  KBUILD_BUILD_HOST: Fnz_09
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache
      - name: Get Proton Clang 13
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang
      - name: Enable KALLSYMS
        run: |
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/$DEFCONFIG
      - name: Disable WireGuard fetch
        run: |
          sed -i '/fetch-latest-wireguard.sh/d' scripts/Kbuild.include
          sed -i '/net\/wireguard\/Kconfig/d' net/Kconfig
          sed -i '/wireguard/d' net/Makefile
          sed -i '/CONFIG_WIREGUARD/d' arch/arm64/configs/$DEFCONFIG
      - name: RieLCantik
        run: |
          sed -i '/^CONFIG_LOCALVERSION=/d' arch/arm64/configs/$DEFCONFIG
          echo 'CONFIG_LOCALVERSION="-RielCantik"' >> arch/arm64/configs/$DEFCONFIG
      - name: Build
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 $DEFCONFIG
          grep -E "KALLSYMS|LOCALVERSION" out/.config
          make -j$(nproc) O=out ARCH=arm64 HOSTCC="gcc -fcommon" CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz-dtb
