name: Build Whyred Kernel with SukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup SukiSU (Manual Hook)
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm make git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Compile Kernel
        run: |
          set -o pipefail # Biar kalau error, GitHub langsung kasih silang merah
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out ARCH=arm64 whyred_defconfig
          make -j4 O=out ARCH=arm64 2>&1 | tee build.log

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Whyred
          path: out/arch/arm64/boot/Image.gz-dtb
