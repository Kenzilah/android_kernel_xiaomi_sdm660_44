name: Build Whyred Kernel

on:
  workflow_dispatch: # Biar bisa dijalanin manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-20.04 # Pakai Ubuntu 20.04 biar toolchain lama lebih kompatibel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Kernel with SukiSU
        uses: Kenzilah/kernel_build_action@main
        with:
          # Ini otomatis ngambil source dari repo kamu sendiri
          kernel-url: https://github.com/Kenzilah/android_kernel_xiaomi_sdm660_44
          kernel-branch: android-4.4-stable
          
          # Nama file defconfig kamu
          config: whyred_defconfig
          arch: arm64
          android-version: 12
          
          # Toolchain (Karena 4.4, kita pakai Clang + GCC AOSP)
          aosp-clang: true
          aosp-gcc: true
          
          # Fitur SukiSU (Biasanya otomatis nge-patch KSU)
          ksu: true
          
          # Bikin file zip AnyKernel3 biar bisa langsung di-flash
          anykernel3: true
          
          # Simpan hasil build jadi Release biar gampang di-download
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
