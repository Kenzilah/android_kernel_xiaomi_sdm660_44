name: Build Kernel
on: workflow_dispatch
env:
  DEFCONFIG: whyred_defconfig
  KBUILD_BUILD_USER: pei
  KBUILD_BUILD_HOST: Fnz_09
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio curl git python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Get Proton Clang 13
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang
      - name: Cek defconfig
        run: ls arch/arm64/configs | grep -i whyred
      - name: Integrasi SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd KernelSU
          git fetch --unshallow || true
          git checkout 28626e15
      - name: Aktifkan KSU dan KPM
        run: |
          cat >> arch/arm64/configs/$DEFCONFIG << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y
          EOF
      - name: Build
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          ARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=gcc"
          make $ARGS $DEFCONFIG
          grep -E "CONFIG_KSU|CONFIG_KPM|KALLSYMS" out/.config
          make -j$(nproc) $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz-dtb
