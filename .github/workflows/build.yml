name: Build Kernel
on: workflow_dispatch
env:
  DEFCONFIG: whyred_defconfig
  KBUILD_BUILD_USER: pei
  KBUILD_BUILD_HOST: Fnz_09
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio curl git python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Get Proton Clang 13
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang
      - name: Integrasi SukiSU Non-GKI
        run: |
          curl -LSs https://raw.githubusercontent.com/xiziya/SukiSU_Non-GKI/builtin/kernel/setup.sh | sh
          ls -l drivers/kernelsu
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig
      - name: Aktifkan KSU dan KPM
        run: |
          cat >> arch/arm64/configs/$DEFCONFIG << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
      - name: Build
        run: |
          PC=$HOME/proton-clang/bin
          export PATH="$PATH:$PC"
          ARGS="O=out ARCH=arm64 CC=$PC/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AR=$PC/llvm-ar NM=$PC/llvm-nm OBJCOPY=$PC/llvm-objcopy OBJDUMP=$PC/llvm-objdump STRIP=$PC/llvm-strip HOSTCC=gcc HOSTCXX=g++"
          make $ARGS $DEFCONFIG
          grep -E "CONFIG_KSU|CONFIG_KPM|KALLSYMS" out/.config
          grep -q "CONFIG_KSU=y" out/.config || { echo "!!! KSU TIDAK AKTIF DI .config"; exit 1; }
          make -j$(nproc) $ARGS
      - name: Buat zip AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cat > AnyKernel3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=San-Kernel SukiSU Ultra KPM
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: San-SukiSU-whyred-AnyKernel3
          path: AnyKernel3/
