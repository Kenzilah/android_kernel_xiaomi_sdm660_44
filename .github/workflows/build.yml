name: Build Kernel
on: workflow_dispatch
env:
  DEFCONFIG: whyred_defconfig
  KBUILD_BUILD_USER: pei
  KBUILD_BUILD_HOST: Fnz_09
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio curl git python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Get Proton Clang 13
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang
      - name: Integrasi SukiSU Non-GKI
        run: |
          curl -LSs https://raw.githubusercontent.com/xiziya/SukiSU_Non-GKI/builtin/kernel/setup.sh | sh
          ls -l drivers/kernelsu
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig
      - name: Backport set_memory.h untuk KPM
        run: |
          cat > include/linux/set_memory.h << 'EOF'
          #ifndef _LINUX_SET_MEMORY_H_
          #define _LINUX_SET_MEMORY_H_
          #include <asm/cacheflush.h>
          #endif
          EOF
      - name: Perbaiki access_ok untuk kernel 4.4
        run: |
          find KernelSU/kernel -name "*.c" -o -name "*.h" | xargs perl -pi -e 's/\baccess_ok\((?!VERIFY_)/access_ok(VERIFY_WRITE, /g unless /^\s*#\s*define/'
          grep -rn "access_ok(" KernelSU/kernel | head -20
      - name: Perbaiki super_access KPM untuk kernel 4.4
        run: |
          F=KernelSU/kernel/kpm/super_access.c
          echo "=== SEBELUM ==="
          sed -n '150,175p' $F
          sed -i '/DEFINE_MEMBER(task_struct, security)/d' $F
          echo "=== SESUDAH ==="
          sed -n '150,175p' $F
      - name: Aktifkan KSU dan KPM tanpa SUSFS
        run: |
          cat >> arch/arm64/configs/$DEFCONFIG << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
      - name: Build
        run: |
          PC=$HOME/proton-clang/bin
          export PATH="$PATH:$PC"
          ARGS="O=out ARCH=arm64 CC=$PC/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AR=$PC/llvm-ar NM=$PC/llvm-nm OBJCOPY=$PC/llvm-objcopy OBJDUMP=$PC/llvm-objdump STRIP=$PC/llvm-strip HOSTCC=gcc HOSTCXX=g++"
          make $ARGS $DEFCONFIG
          echo "=== CONFIG KSU di .config ==="
          grep -E "CONFIG_KSU|CONFIG_KPM|KALLSYMS" out/.config
          echo "=== Opsi HOOK di Kconfig ==="
          grep -n -i "hook" drivers/kernelsu/Kconfig | head -40
          grep -q "CONFIG_KSU=y" out/.config || { echo "!!! KSU TIDAK AKTIF"; exit 1; }
          if grep -q "CONFIG_KSU_SUSFS=y" out/.config; then
            echo "!!! SUSFS MASIH AKTIF"
            exit 1
          fi
          make -j$(nproc) $ARGS
      - name: Buat zip AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cat > AnyKernel3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=San-Kernel SukiSU Ultra KPM
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: San-SukiSU-whyred-AnyKernel3
          path: AnyKernel3/
