name: Build Whyred Kernel with SukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup SukiSU (Manual & Fix Errors)
        run: |
          # 1. Manual git clone (lebih stabil, pake --depth=1 biar ringan)
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          
          # Pindahkan ke folder drivers/kernelsu
          mkdir -p drivers/kernelsu
          cp -r KernelSU/kernel/* drivers/kernelsu/
          rm -rf KernelSU
          
          # 2. Patch static_call
          find drivers/kernelsu/ -type f \( -name "*.h" -o -name "*.c" \) | xargs sed -i '/#include <linux\/static_call.h>/d'
          find drivers/kernelsu/ -type f \( -name "*.h" -o -name "*.c" \) | xargs sed -i '/#include <linux\/static_call_types.h>/d'
          sed -i '1i #define static_call(name) name\n#define static_call_update(name, func) do { } while (0)\n#define static_call_cond(name) name' $(find drivers/kernelsu -type f -name "*.c" | head -n 1)
          
          # 3. HAPUS paksa include SUSFS biar gak error
          find drivers/kernelsu/ -type f \( -name "*.h" -o -name "*.c" \) | xargs sed -i '/#include <linux\/susfs.h>/d'
          echo "# CONFIG_KSU_SUSFS is not set" >> arch/arm64/configs/whyred_defconfig
          
          # 4. FIX ERROR KPM (access_ok & set_memory.h)
          find drivers/kernelsu -type f -name "kpm.c" | xargs sed -i 's/if (access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result)))/if (access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result)))/g'
          find drivers/kernelsu -type f -name "compact.c" | xargs sed -i 's|#include <linux\/set_memory.h>|// #include <linux\/set_memory.h>|g'
          
          echo "Patch SukiSU selesai!"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Nambahin gcc-arm-linux-gnueabi buat 32-bit
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm make git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Compile Kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out ARCH=arm64 whyred_defconfig
          make -j4 O=out ARCH=arm64 2>&1 | tee build.log

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Whyred-SukiSU
          path: out/arch/arm64/boot/Image.gz-dtb
