name: Build San 4.4 + ReSukiSU
on: workflow_dispatch
env:
  DEFCONFIG: whyred_defconfig
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4-stable
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Get Proton Clang 13
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang

      - name: Integrasi ReSukiSU
        run: curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Backport set_memory.h dari 4.19
        run: |
          curl -fsSL -o /tmp/set_memory.h \
            https://raw.githubusercontent.com/user-why-red/android_kernel_xiaomi_sdm660_419/android-4.19-stable-deprecated/arch/arm64/include/asm/set_memory.h \
            || echo "::warning::gagal unduh set_memory.h, KPM mungkin tidak aktif"
          if [ -s /tmp/set_memory.h ]; then
            cp /tmp/set_memory.h arch/arm64/include/asm/set_memory.h
          fi

      - name: Tambal hook (python)
        run: |
          python3 - <<'PY'
          import re, sys

          def patch(path, old, new, label):
              try:
                  s = open(path).read()
              except FileNotFoundError:
                  print(f"SKIP {label}: {path} tidak ada")
                  return
              if new in s:
                  print(f"OK {label}: sudah terpasang")
                  return
              if old not in s:
                  print(f"MISSING {label}: pola tidak ditemukan di {path}")
                  return
              s = s.replace(old, new, 1)
              open(path, 'w').write(s)
              print(f"PATCHED {label}")

          # fs/exec.c : do_execve hook
          patch('fs/exec.c',
              "int do_execve(struct filename *filename,",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n\nint do_execve(struct filename *filename,",
              "exec.c decl")
          patch('fs/exec.c',
              "struct user_arg_ptr envp = { .ptr.native = __envp };\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
              "struct user_arg_ptr envp = { .ptr.native = __envp };\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
              "exec.c call")

          # fs/open.c : faccessat
          patch('fs/open.c',
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n\nSYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif",
              "open.c faccessat")

          # fs/stat.c : newfstatat
          patch('fs/stat.c',
              "struct kstat stat;\n\tint error;\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);",
              "struct kstat stat;\n\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat(dfd, filename, &stat, flag);",
              "stat.c newfstatat")

          # kernel/reboot.c
          patch('kernel/reboot.c',
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\nSYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif",
              "reboot.c")

          # security/selinux/hooks.c (kernel 4.4 < 4.9, wajib)
          patch('security/selinux/hooks.c',
              "static int check_nnp_nosuid(",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern bool is_ksu_transition(const struct task_security_struct *old_tsec, const struct task_security_struct *new_tsec);\n#endif\nstatic int check_nnp_nosuid(",
              "selinux.c decl")
          PY
          echo "=== Laporan hook ==="
          grep -rn "ksu_handle\|is_ksu_transition" fs kernel security 2>/dev/null

      - name: Config
        run: |
          DEF="arch/arm64/configs/$DEFCONFIG"
          grep -q '^CONFIG_KALLSYMS_ALL=y' "$DEF" || echo "CONFIG_KALLSYMS_ALL=y" >> "$DEF"
          echo "CONFIG_KSU=y" >> "$DEF"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEF"
          echo "CONFIG_KPM=y" >> "$DEF"
          echo 'CONFIG_LOCALVERSION="-ReSukiSU"' >> "$DEF"

      - name: Build
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 $DEFCONFIG
          grep -E "KSU|KPM|KALLSYMS" out/.config
          make -j$(nproc) O=out ARCH=arm64 HOSTCC="gcc -fcommon" CC=clang CLANG_TRIPLE=aarch64-linux-gnu- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz-dtb
