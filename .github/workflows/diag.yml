name: Diagnosa Source
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4-stable
          fetch-depth: 1
      - name: Laporan
        run: |
          set +e
          echo "== kernelsu =="
          ls -ld drivers/kernelsu 2>&1
          ls drivers/kernelsu 2>&1 | head -30
          cat .gitmodules 2>&1 | head
          echo "== hooks =="
          grep -rn "ksu_" fs kernel security drivers/input --include=*.c --include=*.h 2>&1 | head -40
          echo "== set_memory =="
          ls arch/arm64/include/asm/set_memory.h 2>&1
          ls include/linux/set_memory.h 2>&1
          echo "== Makefile/Kconfig =="
          grep -n kernelsu drivers/Makefile drivers/Kconfig 2>&1
          echo "== defconfig =="
          grep -n "KSU\|KPM\|KALLSYMS\|KPROBES\|OVERLAY" arch/arm64/configs/whyred_defconfig 2>&1
          echo "== selesai =="
          exit 0
